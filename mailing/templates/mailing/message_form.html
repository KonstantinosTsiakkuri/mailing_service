{% extends "base.html" %}

{% block title %}{% if object %}Изменение сообщения{% else %}Новое сообщение{% endif %}{% endblock %}

{% block content %}
    <h1 class="mb-4">{% if object %}Изменение сообщения{% else %}Новое сообщение{% endif %}</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Сохранить</button>
        <a href="{% url 'mailing:message_list' %}" class="btn btn-secondary">Отмена</a>
    </form>
{% endblock %}
