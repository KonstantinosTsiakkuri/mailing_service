{% extends "base.html" %}

{% block title %}Восстановление пароля{% endblock %}

{% block content %}
    <h1 class="mb-4">Восстановление пароля</h1>
    <p>Введите email, указанный при регистрации, — мы отправим ссылку для создания нового пароля.</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Отправить ссылку</button>
        <a href="{% url 'users:login' %}" class="btn btn-secondary">Назад ко входу</a>
    </form>
{% endblock %}
