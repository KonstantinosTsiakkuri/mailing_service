{% extends "base.html" %}

{% block title %}Удаление клиента{% endblock %}

{% block content %}
    <h1 class="mb-4">Удалить клиента?</h1>
    <p>Вы уверены, что хотите удалить «{{ client.full_name }}»?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Да, удалить</button>
        <a href="{% url 'mailing:client_detail' client.pk %}" class="btn btn-secondary">Отмена</a>
    </form>
{% endblock %}
