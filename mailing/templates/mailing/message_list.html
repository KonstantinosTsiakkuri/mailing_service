{% extends "base.html" %}

{% block title %}Список сообщений{% endblock %}

{% block content %}
    <h1 class="mb-4">Сообщения</h1>
    <a href="{% url 'mailing:message_create' %}" class="btn btn-primary mb-3">Добавить сообщение</a>
    <table class="table table-striped">
        <thead>
            <tr>
                <th>Тема</th>
                <th></th>
            </tr>
        </thead>
        <tbody>
            {% for message in message_list %}
                <tr>
                    <td>{{ message.subject }}</td>
                    <td><a href="{% url 'mailing:message_detail' message.pk %}">Открыть</a></td>
                </tr>
            {% empty %}
                <tr>
                    <td colspan="2">Сообщений пока нет</td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
{% endblock %}
