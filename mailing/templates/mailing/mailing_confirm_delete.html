{% extends "base.html" %}

{% block title %}Удаление рассылки{% endblock %}

{% block content %}
    <h1 class="mb-4">Удалить рассылку?</h1>
    <p>Вы уверены, что хотите удалить рассылку «{{ mailing.message.subject }}»?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Да, удалить</button>
        <a href="{% url 'mailing:mailing_detail' mailing.pk %}" class="btn btn-secondary">Отмена</a>
    </form>
{% endblock %}
